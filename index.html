<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> to-do list</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

      <div class="container">
         <div class="header">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="search for any training you want ">
            </div>
                       
            <div class="header-icon">
                <button class="icon-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-dot"></span>
                </button>

                <button class="icon-btn">
                    <i class="fas fa-user"></i>
                </button>
            </div>
 
         </div>


            <div class="main-content">
               <div class="title-section">
                   <h1>you've got 
                     <span class="task-count" id="taskcount">0</span> task today
                        <button class="add-btn" onclick="openModal()">
                          <i class="fas fa-plus"></i>Add New
                        </button>
                   </h1>
                </div>
  

                <div class="section">
                    <div class="section-header">
                        <h2>On Hold</h2>
                    </div>


                   <div id="onholdtasks">

                     <!-- <div class="task-items">
                        <div class="task-checkbox " onclick="toggleTask()"></div>

                        <div class="task-content">
                            <div class="task-title">book</div>        
                        </div>

                        <span class="status-badge status-something"></span> 

                        <div class=".priority-badge priority-something">
                            <i class="fas fa-circle"></i>
                        </div>

                        <div class="avatar">CF</div>
                        <button class="icon-btn" onclick="editTask()">
                            <i class="fas fa-pen"></i>
                        </button>

                        <button class="icon-btn" onclick="deleteTask()">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div> -->
                   </div> 
                </div> 


                <div class="section">
                    <div class="section-header">
                        <h2>Completed</h2>
                        <span class="badge badge-inactive">Inactive</span>
                    </div>

                     <div id="completedtasks"></div>
                </div>

            </div>

                     
                <div class="sidebar">
                    <div class="sidebar-section">
                        <div class="sidebar-title">Results Summary</div>
                        <div class="stat-card">
                           <div class="stat-label">Completion Rate</div>
                           <div class="stat-value" id="completionRateValue">0%</div>
                           <div class="progress-bar">
                              <div class="progress-fill" id="CompletionProgress" style="width:0%"></div>
                           </div>

                        </div>



                        <div class="stat-card">
                           <div class="stat-label">Total Task</div>
                           <div class="stat-value" id="totalTask">0</div>
                           <div class="progress-bar">
                              <div class="progree-fill" id="totalProgress" style="width:0"></div>
                           </div>
                        </div>



                        <div class="stat-card">
                           <div class="stat-label">Completed</div>
                           <div class="stat-value" id="completionRateValue">0</div>
                        </div>


                         <div class="stat-card">
                           <div class="stat-label">pending</div>
                           <div class="stat-value" id="pendingCount">0</div>
                        </div>



                    </div>
                </div>

      </div>

<div class="modal" id="taskModal">
    <div class="modal-content">
        <h2 class="modal-header">Add / Update Task</h2>
        <form id="taskForm">

        <div> 
            <label>Task Title</label>
            <input type="text" id="taskTitle" placeholder="Enter task title " required >
        </div>
            
        <div class="form-group">
            <label>Status</label>
            <select id="taskStatus">
            <option value="pending">Pending</option>
                        <option value="pending">Pending</option>
            <option value="pending">Pending</option>

              </select>    
        
        </div>
        </form>
    </div>
</div>


</body>

    <script src="script.js"></script>

</html>
